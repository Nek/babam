<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    <header>
        <h1>{{(+ 1 2)}}</h1>
    </header>
    <comps:counter a="1" b="yes" c="{{(* 10 3)}}">
        <span>4</span>
        <div>123</div>
    </comps:counter>
    <comps:card>
        <span>Card Title</span>
    <comps:counter a="0" b="false" c="{{(* 10 3)}}"> 
        <span>4</span>
        <div>123</div>
    </comps:counter>
    </comps:card>
    <main>
        <p>This is a basic HTML5 template.</p>
    </main>
    <footer>
        <p>&copy; 2025 Your Name</p>
    </footer>
</body>
</html>
